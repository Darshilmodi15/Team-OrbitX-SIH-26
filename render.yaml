# Render Blueprint Specification for Matsya (powered by ORCA)
# Auto-provisions: FastAPI Backend + PostgreSQL Database + Redis Cache + Static Frontend

services:
  # 1. Matsya FastAPI Backend Web Service (Render service name kept stable; rename manually if desired)
  - type: web
    name: orca-backend
    runtime: python
    region: singapore
    plan: free
    healthCheckPath: /health
    buildCommand: "cd backend && pip install -r requirements.txt && python -m alembic upgrade head"
    startCommand: 'cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"'
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: LANGUAGE_PROVIDER
        value: sarvam
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://matsya.app
      - key: FRONTEND_ORIGIN
        value: https://matsya.app,https://www.matsya.app,https://team-orbit-x-sih-26.vercel.app
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Matsya <noreply@matsya.app>
      - key: EMAIL_REPLY_TO
        value: support@matsya.app
      - key: INCOIS_BASE_URL
        value: https://incois.gov.in
      - key: INCOIS_TIMEOUT_SEC
        value: 4.0
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Matsya React 19 Frontend (Static Site)
  - type: web
    name: orca-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: orca-backend
          property: host


