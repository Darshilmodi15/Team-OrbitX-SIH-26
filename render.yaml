# Render Blueprint Specification for ORCA Marine AI
# Auto-provisions: FastAPI Backend + PostgreSQL Database + Redis Cache + Static Frontend

services:
  # 1. ORCA FastAPI Backend Web Service
  - type: web
    name: orca-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && python3 seed/seed_database.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orca-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: orca-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INCOIS_BASE_URL
        value: https://incois.gov.in
      - key: INCOIS_TIMEOUT_SEC
        value: 4.0
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. ORCA Redis Cache
  - type: redis
    name: orca-cache
    region: singapore
    plan: free
    ipAllowList: []

  # 3. ORCA React 19 Frontend (Static Site)
  - type: web
    name: orca-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: orca-backend
          property: host

databases:
  # Managed PostgreSQL Database (16 Normalized Tables via Alembic)
  - name: orca-postgres
    databaseName: orca_marine
    user: orca_admin
    region: singapore
    plan: free
