<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = "system", size = 100;
        try {
          theme = localStorage.getItem("orca_theme") || "system";
          const stored = Number(localStorage.getItem("orca_text_size"));
          if ([90,100,112.5,125,150].includes(stored)) size = stored;
        } catch {}
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.style.fontSize = size + "%";
      })();
    </script>
    <style>html,body{margin:0;background:#fff;color:#202123}html.dark,html.dark body{background:#212121;color:#ececec}</style>
